/* Eingabevalidierung im bestehenden blauen Design */
.input-modal-backdrop{position:fixed;inset:0;z-index:200;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.input-modal{width:min(100%,390px);background:linear-gradient(150deg,#0b2037,#061426);border:1px solid #285078;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0009}.input-modal h3{font-size:16px;margin:0 0 12px}.input-modal input{width:100%;background:#071629;border:1px solid #244665;border-radius:11px;padding:12px;color:#f3f7ff;font-size:16px;outline:none}.input-modal input:focus{border-color:#2997ff}.amount-input-wrap{display:flex;align-items:center;gap:10px;background:#071629;border:1px solid #244665;border-radius:11px;padding:0 13px}.amount-input-wrap:focus-within{border-color:#2997ff}.amount-input-wrap input{flex:1;min-width:0;border:0!important;background:transparent!important;padding:12px 0!important;box-shadow:none!important}.amount-input-wrap .currency-suffix{font-size:16px;font-weight:750;color:#8fcaff;white-space:nowrap}.input-modal input.invalid{border-color:#ff6568;color:#ff8d91;box-shadow:0 0 0 1px #ff656844}.input-error{min-height:17px;color:#ff777b;font-size:11px;margin-top:7px}.input-modal-actions{display:flex;gap:8px;margin-top:14px}.input-modal-actions button{flex:1;border-radius:10px;padding:11px;border:1px solid #285078;background:#102a45;color:#eaf4ff}.input-modal-actions .save{border:0;background:linear-gradient(135deg,#2799ff,#0864d5);font-weight:750}.input-modal-actions .save:disabled{opacity:.4;cursor:not-allowed}

/* iPhone-Layout v4: Safe Areas, bessere Lesbarkeit und keine Überlagerungen */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { width:100%; min-width:0; overflow-x:hidden; }
body { margin:0; }
.app {
  width:100%; max-width:none; min-width:0;
  min-height:100vh; min-height:100svh; min-height:100dvh;
  padding-top:calc(env(safe-area-inset-top, 0px) + 8px);
  padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px));
  overflow:clip;
}
.topline {
  width:100%; min-width:0; gap:10px;
  padding:8px 16px 12px;
  scroll-margin-top:env(safe-area-inset-top, 0px);
}
.headcopy { min-width:0; overflow-wrap:anywhere; }
.headcopy h1 { font-size:clamp(22px, 5.6vw, 28px); line-height:1.2; overflow-wrap:anywhere; }
.headcopy p { font-size:clamp(13px, 3.5vw, 15px); line-height:1.35; }
.content {
  width:100%; min-width:0; padding:0 16px 28px;
  min-height:calc(100svh - 145px);
  overflow-x:hidden; overflow-y:visible;
  overflow-wrap:anywhere;
}
.content * { min-width:0; }
.hero { padding:16px; }
.eyebrow { font-size:clamp(13px, 3.4vw, 15px); line-height:1.4; }
.balance { font-size:clamp(30px, 7.5vw, 38px); line-height:1.15; overflow-wrap:anywhere; }
.next-pay { font-size:clamp(13px, 3.4vw, 15px); line-height:1.45; gap:8px; }
.summary-label { font-size:clamp(12px, 3.1vw, 14px); line-height:1.35; }
.summary-value { font-size:clamp(15px, 3.8vw, 18px); line-height:1.3; overflow-wrap:anywhere; }
.section-title { font-size:clamp(17px, 4.4vw, 20px); line-height:1.3; gap:10px; }
.link { font-size:clamp(13px, 3.4vw, 15px); white-space:normal; text-align:right; }
.tiles { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.tile { min-width:0; padding:13px 11px; min-height:120px; }
.tile-title { font-size:clamp(12px, 3.2vw, 14px); white-space:normal; line-height:1.35; padding-right:13px; overflow-wrap:anywhere; }
.tile-amount { font-size:clamp(16px, 4vw, 18px); line-height:1.25; }
.tile-sub { font-size:clamp(12px, 3.1vw, 14px); line-height:1.4; overflow-wrap:anywhere; }
.compare-head, .card-title { font-size:clamp(14px, 3.6vw, 16px); line-height:1.35; gap:8px; }
.compare-copy { font-size:clamp(12px, 3.1vw, 14px); line-height:1.5; }
.compare-copy b { font-size:clamp(13px, 3.3vw, 15px); }
.transaction { gap:9px; }
.tx-name { font-size:clamp(14px, 3.6vw, 16px); line-height:1.35; overflow-wrap:anywhere; }
.tx-date { font-size:clamp(12px, 3.1vw, 14px); line-height:1.35; }
.tx-amount { font-size:clamp(14px, 3.6vw, 16px); white-space:normal; text-align:right; }
.form-field { font-size:clamp(13px, 3.4vw, 15px); line-height:1.4; }
.form-field span { line-height:1.4; }
.form-field input, .form-field select, .form-field textarea,
.form-row input, .form-row select, .search, .month-select { font-size:16px; line-height:1.35; max-width:100%; }
.form-row label, .menu-item { font-size:clamp(14px, 3.6vw, 16px); line-height:1.4; }
.primary, .overview-btn, .form-actions button { font-size:clamp(14px, 3.6vw, 16px); line-height:1.35; min-height:46px; }
.card, .list-card, .goal, .reminder-row { max-width:100%; overflow-wrap:anywhere; }
.bottom-nav {
  left:0; right:0; width:100%; max-width:none; transform:none;
  bottom:0; height:calc(70px + env(safe-area-inset-bottom, 0px));
  padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.nav-btn { min-width:0; font-size:clamp(11px, 2.9vw, 13px); line-height:1.25; gap:5px; white-space:normal; text-align:center; }
.nav-btn .nav-icon { font-size:21px; }
.nav-btn.active:after { bottom:calc(3px + env(safe-area-inset-bottom, 0px)); }
.input-modal-backdrop { padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y:auto; }
.input-modal { max-height:calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y:auto; }
button, input, select, textarea { max-width:100%; }
@media (max-width:380px) {
  .content { padding-left:12px; padding-right:12px; }
  .topline { padding-left:12px; padding-right:12px; }
  .tiles { gap:8px; }
  .tile { padding:11px 9px; }
  .tile-title { font-size:12px; }
}
@media (min-width:700px) {
  .app { max-width:900px; margin:0 auto; border-left:1px solid #173653; border-right:1px solid #173653; }
  .bottom-nav { left:50%; transform:translateX(-50%); max-width:900px; }
}


/* Einheitliche Lifestyle-Eingabefenster statt iOS-Standard-Prompts */
.input-modal-backdrop,.lifestyle-prompt-backdrop{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,5,14,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.input-modal,.lifestyle-prompt{width:min(100%,560px);max-height:calc(100dvh - 40px);overflow:auto;background:linear-gradient(145deg,#0b2038,#061629);border:1px solid #31577d;border-radius:26px;padding:24px;box-shadow:0 22px 70px #0009;color:#f3f7ff}
.input-modal h3,.lifestyle-prompt h3{font-size:clamp(20px,5vw,30px);line-height:1.2;margin:0 0 18px;font-weight:750;color:#f4f8ff}
.lifestyle-prompt .prompt-label{display:block;font-size:16px;color:#c3d4e8;margin-bottom:12px}

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-title" content="Lifestyle Finanzen">
</head>
<body>
<section id="authGate" aria-live="polite">
  <div class="auth-card">
    <div class="auth-brand">Lifestyle Finanzen</div>
    <h1 id="authTitle">Willkommen zurück</h1>
    <p id="authSubtitle">Melde dich an, um deine Finanzen zu öffnen.</p>
    <form id="authForm">
      <label for="authEmail">E-Mail-Adresse</label><input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPassword">Passwort</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
      <button id="authSubmit" type="submit">Anmelden</button>
    </form>
    <button id="authForgot" class="secondary" type="button">Passwort vergessen?</button>
    <button id="authSwitch" class="secondary" type="button">Neues Konto erstellen</button>
    <p id="authMessage" class="auth-message"></p>
    <p>Deine Finanzdaten werden nach Einrichtung des Online-Speichers getrennt pro Konto gespeichert.</p>
  </div>
</section>
<button id="authLogout" type="button" hidden>Abmelden</button>

<div class="app" id="app" hidden>
  <div id="topline" class="topline"></div>
  <main id="content" class="content"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>Startseite</span></button>
    <button class="nav-btn" data-page="bookings"><span class="nav-icon">▤</span><span>Buchungen</span></button>
    <button class="nav-btn" data-page="analytics"><span class="nav-icon">▥</span><span>Auswertung</span></button>
    <button class="nav-btn" data-page="more"><span class="nav-icon">⋮</span><span>Mehr</span></button>
  </nav>
</div>
<script>
const euro=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let state={page:'home',month:0,filter:'Alle',search:'',fixedMonth:false,oneAll:false,instOpen:false,transactions:[],fixed:[],one:[],inst:[],goals:[],accounts:[],notes:[],categories:[],layoutOrder:['fixed','one','installments','goals'],layoutVisible:{fixed:true,one:true,installments:true,goals:true},currency:'EUR'};
const defaultState={...state};
window.lifestyleApplyState=function(saved){state={...defaultState,...(saved&&typeof saved==='object'?saved:{}),page:'home'};state.monthlySalary=Number(state.monthlySalary)||0;state.userName=state.userName||'';state.reminders=state.reminders||{inst:{enabled:false,day:1,time:'09:00'},one:{enabled:false,day:1,time:'09:00'},goals:{enabled:false,day:1,time:'09:00'}};state.notes=(state.notes||[]).map(n=>({...n,reminder:n.reminder||{enabled:false,date:'',time:'09:00'}}));state.one=(state.one||[]).map((x,i)=>{if(!x[5]||typeof x[5]!=='object')x[5]={enabled:false,date:'',time:'09:00'};if(!x[6])x[6]='one-migrated-'+i+'-'+String(x[0]||'ausgabe');return x;});state.reminderFired=state.reminderFired||{};render();};
state.monthlySalary=Number(state.monthlySalary)||0;state.userName=state.userName||'';
state.reminders=state.reminders||{inst:{enabled:false,day:1,time:'09:00'},one:{enabled:false,day:1,time:'09:00'},goals:{enabled:false,day:1,time:'09:00'}};
state.notes=(state.notes||[]).map(n=>({...n,reminder:n.reminder||{enabled:false,date:'',time:'09:00'}}));
state.one=(state.one||[]).map((x,i)=>{if(!x[5]||typeof x[5]!=='object')x[5]={enabled:false,date:'',time:'09:00'};if(!x[6])x[6]='one-migrated-'+i+'-'+String(x[0]||'ausgabe');return x;});
state.reminderFired=state.reminderFired||{};
function persistState(){try{if(window.lifestyleUserStorageKey)localStorage.setItem(window.lifestyleUserStorageKey,JSON.stringify(state));}catch(e){}if(window.lifestyleCloudSave)window.lifestyleCloudSave(state);}
window.lifestyleGetState=()=>state;
function head(title,sub='',back=false,plus=''){return `<div class="topline">${back?'<button class="back" onclick="goBack()">‹</button>':''}<div class="headcopy"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${plus?`<button class="circle-btn" onclick="${plus}">＋</button>`:''}</div>`}
function icon(txt,cl){return `<span class="tile-icon ${cl}">${txt}</span>`}
function tile(title,amount,sub,ico,cl,page){return `<button class="tile" onclick="navigate('${page}')">${icon(ico,cl)}<span class="chev">›</span><span class="tile-title">${title}</span><span class="tile-amount">${amount}</span><span class="tile-sub">${sub}</span></button>`}
function tx(t){return `<div class="transaction"><span class="tx-icon ${t.color}">${t.icon}</span><div class="tx-main"><div class="tx-name">${t.name}</div><div class="tx-date">${t.date}</div></div><div class="tx-amount ${t.amount>=0?'green':'red'}">${t.amount>=0?'+':''}${euro(t.amount)}</div></div>`}
function itemCard(row,amount=true){return `<div class="list-card"><div class="transaction"><span class="tx-icon ${row[4]}">${row[3]}</span><div class="tx-main"><div class="tx-name">${row[0]}</div><div class="tx-date">${row[2]}</div></div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(row[1]))}</div></div></div>`}

function parseGermanAmount(value){
  if(typeof value==='number') return Number.isFinite(value)?value:0;
  let s=String(value??'').trim().replace(/[^\d,.-]/g,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}
function formatGermanEuro(value){
  return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(value)||0)+' €';
}
function oneTimeTotalForCurrentMonth(){
  const now=new Date();
  return (state.one||[]).reduce((sum,x)=>{
    const m=String(x[2]||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if(!m) return sum;
    if(Number(m[2])-1!==now.getMonth() || Number(m[3])!==now.getFullYear()) return sum;
    return sum+parseGermanAmount(x[1]);
  },0);
}

function home(){const currentOne=state.one.filter(x=>isValidFromThisMonth(x[2]));const bookedIncome=state.transactions.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);const salary=Number(state.monthlySalary)||0;const totalIncome=bookedIncome+salary;const bookedExpenses=Math.abs(state.transactions.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0));const fixedExpenses=(state.fixed||[]).reduce((sum,x)=>sum+Math.max(0,parseGermanAmount(x[1])),0);const oneTimeExpenses=oneTimeTotalForCurrentMonth();const totalSpent=bookedExpenses+fixedExpenses+oneTimeExpenses;const balance=totalIncome-totalSpent;const fmt=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:state.currency||'EUR'}).format(n);const hasTransactions=state.transactions.length>0||salary>0;const greeting=state.userName?`Hallo, ${escapeHTML(state.userName)}!`:'Willkommen bei Lifestyle';return head('Lifestyle',greeting)+`<section class="hero"><div class="eyebrow">Diesen Monat verfügbar</div><div class="balance">${hasTransactions?fmt(balance):'—'}</div><div class="next-pay" onclick="navigate('settings')" role="button" tabindex="0"><span>▣</span><span>Monatlicher Lohn: ${salary>0?fmt(salary):'Noch nicht angegeben'}</span><span class="chev">›</span></div><div class="next-pay" onclick="navigate('settings')" role="button" tabindex="0"><span>▣</span><span>Nächster Lohn: ${state.nextPay?escapeHTML(state.nextPay):'Noch nicht angegeben'}</span><span class="chev">›</span></div><div class="summary"><div><div class="summary-label"><span class="green">↗</span>Einnahmen</div><div class="summary-value green">${hasTransactions?fmt(totalIncome):'—'}</div></div><div><div class="summary-label"><span class="red">↗</span>Ausgaben</div><div class="summary-value red">${hasTransactions?fmt(totalSpent):'—'}</div></div></div></section><div class="section-title">Deine Bereiche</div><div class="tiles">${(state.layoutOrder||['fixed','one','installments','goals']).filter(k=>state.layoutVisible?.[k]!==false).map(k=>({fixed:tile('Feste Ausgaben',state.fixed.length?fmt(state.fixed.reduce((s,x)=>s+parseMoney(x[1]),0)):'—',state.fixed.length?`${state.fixed.length} Einträge`:'Noch keine Angaben','⌂','ic-blue','fixed'),one:tile('Einmalige Ausgabe',currentOne.length?fmt(currentOne.reduce((s,x)=>s+parseMoney(x[1]),0)):'—',currentOne.length?`${currentOne.length} fällige Einträge`:'Diesen Monat keine fälligen Ausgaben','▤','ic-purple','one'),installments:tile('Raten & Verpflichtungen',state.inst.length?`${state.inst.length} Einträge`:'—',state.inst.length?'Laufende Raten':'Noch keine Angaben','☷','ic-orange','installments'),goals:tile('Sparziele',state.goals.length?`${state.goals.length} Ziele`:'—',state.goals.length?'Weiter sparen':'Noch keine Angaben','◎','ic-green','goals')})[k]).join('')}</div><section class="home-one-time"><div class="section-title">Einmalige Ausgaben <button class="link" onclick="navigate('one')">Alle anzeigen ›</button></div>${currentOne.slice(0,2).map(x=>`<div class="list-card"><div class="transaction"><span class="tx-icon ${x[4]||'ic-blue'}">${escapeHTML(x[3]||'▤')}</span><div class="tx-main"><div class="tx-name">${escapeHTML(x[0])}</div><div class="tx-date">Fällig am ${escapeHTML(x[2]||'—')}</div>${(()=>{const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(x[2]||''));if(!m)return '';const due=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));return `<div class="note-reminder">${dueCountdownLabel(due)}</div>`})()}${x[5]?.enabled?`<div class="note-reminder">◷ Erinnerung: ${escapeHTML(formatReminderDate(x[5].date))} um ${escapeHTML(x[5].time||'09:00')}</div>`:''}</div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(x[1]))}</div></div></div>`).join('')||'<div class="empty">Diesen Monat keine fälligen einmaligen Ausgaben.</div>'}</section>${hasTransactions?`<section class="compare"><div class="compare-head">Ausgaben im Vergleich <span class="mini-chart-icon">▥</span></div><div class="compare-copy">Weitere Vergleichswerte erscheinen, sobald Buchungen für mehrere Monate eingetragen sind.</div></section>`:''}<div class="section-title">Letzte Buchungen <button class="link" onclick="navigate('bookings')">Alle anzeigen ›</button></div>${state.transactions.slice(0,3).map(tx).join('')||'<div class="empty">Noch keine Buchungen eingetragen</div>'}`}
function bookings(){let list=state.transactions.filter(t=>(state.filter==='Alle'||t.kind===state.filter)&&t.name.toLowerCase().includes(state.search.toLowerCase()));return head('Buchungen')+`<div class="search-row"><input class="search" placeholder="⌕  Buchungen suchen ..." value="${escapeHTML(state.search)}" oninput="state.search=this.value;render()"><button class="filter" onclick="showToast('Filter ausgewählt')">☷</button></div><div class="segmented">${['Alle','Einnahmen','Ausgaben'].map(x=>`<button class="${state.filter===x?'active':''}" onclick="state.filter='${x}';render()">${x}</button>`).join('')}</div>${list.length?list.map(tx).join(''):'<div class="empty">Noch keine Buchungen eingetragen</div>'}<button class="primary" onclick="addBooking()">＋ Buchung hinzufügen</button>`}
function analytics(){const expenses=state.transactions.filter(t=>t.amount<0);if(!expenses.length)return head('Auswertung')+`<section class="card"><div class="card-title">Ausgaben nach Kategorien</div><div class="empty">Noch keine Ausgaben vorhanden. Trage zuerst eigene Buchungen ein, damit hier deine Auswertung erscheint.</div></section>`;const total=Math.abs(expenses.reduce((s,t)=>s+t.amount,0));const byCategory={};expenses.forEach(t=>{const c=t.category||'Ohne Kategorie';byCategory[c]=(byCategory[c]||0)+Math.abs(t.amount)});return head('Auswertung')+`<section class="card"><div class="card-title">Ausgaben nach Kategorien</div><div class="donut-wrap"><div class="donut"><div class="donut-center">${new Intl.NumberFormat('de-DE',{style:'currency',currency:state.currency||'EUR'}).format(total)}<small>Gesamtausgaben</small></div></div></div>${Object.entries(byCategory).map(([name,value])=>`<div class="category-row"><span class="dot" style="background:#258cff"></span><span class="cat">${escapeHTML(name)}</span><span class="cat-value">${new Intl.NumberFormat('de-DE',{style:'currency',currency:state.currency||'EUR'}).format(value)}</span><span class="percent">${Math.round(value/total*100)} %</span></div>`).join('')}</section>`}
function fixed(){return head('Feste Ausgaben','',true,'addFixed()')+`${state.fixed.map((x,i)=>`<div class="list-card"><div class="transaction"><span class="tx-icon ${x[4]}">${escapeHTML(x[3])}</span><div class="tx-main"><div class="tx-name">${escapeHTML(x[0])}</div><div class="tx-date">Monatlich</div></div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(x[1]))}</div><div class="item-actions"><button aria-label="Bearbeiten" onclick="editItem('fixed',${i})">✎</button><button aria-label="Löschen" onclick="deleteItem('fixed',${i})">×</button></div></div></div>`).join('')}<button class="overview-btn" onclick="navigate('home')">‹ Zur Übersicht</button>`}
function one(){const today=new Date();const visible=state.one.map((x,i)=>({x,i})).filter(({x})=>state.oneAll||isValidFromThisMonth(x[2],today));return head('Einmalige Ausgabe','',true,'addOne()')+`<div class="segmented"><button class="${!state.oneAll?'active':''}" onclick="state.oneAll=false;render()">Aktuell</button><button class="${state.oneAll?'active':''}" onclick="state.oneAll=true;render()">Alle</button></div>${visible.map(({x,i})=>`<div class="list-card"><div class="transaction"><span class="tx-icon ${x[4]||'ic-blue'}">${escapeHTML(x[3]||'▤')}</span><div class="tx-main"><div class="tx-name">${escapeHTML(x[0])}</div><div class="tx-date">Fällig am ${escapeHTML(x[2]||'—')}</div>${x[5]?.enabled?`<div class="note-reminder">◷ Erinnerung: ${escapeHTML(formatReminderDate(x[5].date))} um ${escapeHTML(x[5].time||'09:00')}</div>`:'<div class="tx-date">Keine Erinnerung eingestellt</div>'}</div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(x[1]))}</div><div class="item-actions"><button aria-label="Bearbeiten" title="Bearbeiten" onclick="editItem('one',${i})">✎</button><button aria-label="Löschen" title="Löschen" onclick="deleteItem('one',${i})">×</button></div></div></div>`).join('')||'<p class="empty-state">Keine einmaligen Ausgaben für diesen Monat.</p>'}<button class="overview-btn" onclick="navigate('home')">‹ Zur Übersicht</button>`}
function isValidFromThisMonth(dateStr,today=new Date()){const m=String(dateStr||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(!m)return true;const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()<today.getFullYear()||(d.getFullYear()===today.getFullYear()&&d.getMonth()<=today.getMonth())}
function installments(){return head('Raten & Verpflichtungen','',true,'addInstallment()')+`<div class="segmented"><button class="${!state.instOpen?'active':''}" onclick="state.instOpen=false;render()">Alle</button><button class="${state.instOpen?'active':''}" onclick="state.instOpen=true;render()">Offen</button></div>${state.inst.map((x,i)=>`<div class="list-card"><div class="transaction"><span class="tx-icon ${x[4]}">${escapeHTML(x[3])}</span><div class="tx-main"><div class="tx-name">${escapeHTML(x[0])}</div><div class="tx-date">${escapeHTML(x[2])}${x[5]?` · Beginn: ${escapeHTML(x[5])}`:` · Beginn noch nicht angegeben`}${x[7]?`<div class="tx-date">Ende: ${escapeHTML(formatReminderDate(x[7]))}</div>`:''}${x[5]?`<div class="note-reminder">${nextInstallmentDue(x[5],x[2],new Date(),x[7])?`Nächste Fälligkeit: ${formatLocalDate(nextInstallmentDue(x[5],x[2],new Date(),x[7]))} · ${dueCountdownLabel(nextInstallmentDue(x[5],x[2],new Date(),x[7]))}`:'Zahlungszeitraum beendet'}</div>`:'<div class="note-reminder">Bitte Beginn der Zahlung festlegen, damit der Countdown angezeigt wird.</div>'}${x[6]?.enabled?`<div class="note-reminder">◷ Erinnerung: ${escapeHTML(formatReminderDate(x[6].date))} um ${escapeHTML(x[6].time||"09:00")}</div>`:`<div class="tx-date">Keine eigene Erinnerung</div>`}</div></div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(x[1]))}</div><div class="item-actions"><button aria-label="Bearbeiten" onclick="editItem('inst',${i})">✎</button><button aria-label="Löschen" onclick="deleteItem('inst',${i})">×</button></div></div></div>`).join('')}<button class="overview-btn" onclick="navigate('home')">‹ Zur Übersicht</button>`}
function goals(){return head('Sparziele','',true,'addGoal()')+state.goals.map((x,i)=>`<div class="goal"><span class="goal-icon ${x[5]}">${escapeHTML(x[4])}</span><div class="goal-main"><div class="goal-title">${escapeHTML(x[0])}</div><div class="goal-amount">${formatGermanEuro(parseGermanAmount(x[1]))}</div><div class="progress ${x[4]==='🌴'?'greenbar':''}"><span style="width:${parseInt(x[3])||0}%"></span></div><div class="goal-meta"><span>${formatGermanEuro(parseGermanAmount(x[2]))} / ${formatGermanEuro(parseGermanAmount(x[1]))}</span><span>${escapeHTML(x[3])}</span></div></div><div class="item-actions"><button aria-label="Bearbeiten" onclick="editItem('goals',${i})">✎</button><button aria-label="Löschen" onclick="deleteItem('goals',${i})">×</button></div></div>`).join('')+`<button class="overview-btn" onclick="navigate('home')">‹ Zur Übersicht</button>`}
function accounts(){return head('Verbundene Konten','',true,'addAccount()')+state.accounts.map(x=>`<div class="list-card"><button class="transaction" style="width:100%;background:transparent;border:0;text-align:left" onclick="showToast('${x[0]}')"><span class="tx-icon ${x[4]}" style="font-weight:800">${x[3]}</span><div class="tx-main"><div class="tx-name">${x[0]}</div><div class="tx-date">${x[1]}</div></div><div class="tx-amount">${formatGermanEuro(parseGermanAmount(x[2]))}</div><span class="chev" style="font-size:20px;color:#9eb6d0">›</span></button></div>`).join('')}
function more(){return head('Mehr')+`<div class="card" style="padding:2px 12px">${[['♢','Kategorien verwalten','categories'],['♜','Verbundene Konten','accounts'],['▦','Layout bearbeiten','layout'],['☁','Datensicherung herunterladen','backup'],['▤','Notizen','notes'],['◷','Erinnerungen','reminders'],['⚙','Einstellungen','settings'],['◴','Werkseinstellungen','reset'],['ⓘ','Guide / Einführung','guide']].map(x=>`<button class="menu-item" onclick="navigate('${x[2]}')"><span class="menu-icon">${x[0]}</span><span>${x[1]}</span><span class="chev">›</span></button>`).join('')}</div><div class="owner-footer">Lifestyle Finanzen<br>© 2026 Fabio Wedlich · Alle Rechte vorbehalten</div><div id="logoutSlot"></div>`}
function genericPage(title,desc,body){return head(title,'',true)+`<section class="card">${desc?`<div class="card-title">${desc}</div>`:''}${body}</section>`}
function splitHeader(full){
  const start=full.indexOf('<div class="topline">');
  if(start!==0) return {top:'',body:full};
  let i=start, depth=0, inTag=false, tag='';
  while(i<full.length){
    if(full.startsWith('<div',i)){depth++; i+=4; continue;}
    if(full.startsWith('</div>',i)){depth--; i+=6; if(depth===0) return {top:full.slice(0,i),body:full.slice(i)}; continue;}
    i++;
  }
  return {top:full,body:''};
}

 function finish(value){wrap.remove();resolve(value)}

async function addOne(){let n=await appPrompt('Name der einmaligen Ausgabe?');if(!n||!n.trim())return;let a=await askValidated('Betrag der Ausgabe','0,00','amount');if(a===null)return;let d=await askValidated('Wann ist die Ausgabe fällig? (TT.MM.JJJJ)',todayGermanDate(),'date');if(d===null)return;let reminder={enabled:false,date:'',time:'09:00'};if(await appConfirm('Möchtest du für diese einmalige Ausgabe eine eigene Erinnerung einstellen?\n\nOK = Erinnerung einstellen, Abbrechen = ohne Erinnerung speichern')){let rd=await askValidated('Erinnerungsdatum (TT.MM.JJJJ)',d,'date',toISODate(d));if(rd===null)return;let iso=toISODate(rd);let rt=await askValidated('Erinnerungsuhrzeit','09:00','time');if(rt===null)return;if(iso>toISODate(d)){showToast('Die Erinnerung darf nicht nach dem Fälligkeitsdatum liegen');return}reminder={enabled:true,date:iso,time:rt};requestNotificationPermission()}state.one.push([n.trim(),a,d,'▤','ic-blue',reminder,'one-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)]);persistState();render();showToast(reminder.enabled?'Ausgabe mit Erinnerung gespeichert':'Einmalige Ausgabe gespeichert')}

function parseMoney(v){const s=String(v??'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizeTypedDate(value){const digits=String(value||'').replace(/\D/g,'').slice(0,8);if(digits.length<=2)return digits;if(digits.length<=4)return digits.slice(0,2)+'.'+digits.slice(2);return digits.slice(0,2)+'.'+digits.slice(2,4)+'.'+digits.slice(4)}
function validGermanAmount(value){const s=String(value||'').trim().replace(/\s|€/g,'');return /^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(s)&&/\d/.test(s)}
function askValidated(label,initial,kind,maxDate=''){return new Promise(resolve=>{const wrap=document.createElement('div');wrap.className='input-modal-backdrop';const inputType=kind==='time'?'time':'text';wrap.innerHTML=`<div class="input-modal" role="dialog" aria-modal="true"><h3>${escapeHTML(label)}</h3>${kind==='amount'?`<div class="amount-input-wrap"><input autocomplete="off" type="text" value="${escapeHTML(initial??'')}" inputmode="decimal" placeholder="z. B. 125,50" aria-label="${escapeHTML(label)}"><span class="currency-suffix">€</span></div>`:`<input autocomplete="off" type="${inputType}" value="${escapeHTML(initial??'')}" ${kind==='date'?'inputmode="numeric" maxlength="10" placeholder="TT.MM.JJJJ"':''}>`}<div class="input-error" aria-live="polite"></div><div class="input-modal-actions"><button type="button" class="cancel">Abbrechen</button><button type="button" class="save">Speichern</button></div></div>`;document.body.appendChild(wrap);const inp=wrap.querySelector('input'),err=wrap.querySelector('.input-error'),save=wrap.querySelector('.save');let done=false;function validate(){let message='';const v=inp.value.trim();if(!v)message=kind==='amount'?'Bitte einen Betrag eingeben.':kind==='date'?'Bitte ein Datum eingeben.':'Bitte einen Wert eingeben.';else if(kind==='amount'&&!validGermanAmount(v))message='Nur Zahlen eingeben, z. B. 125,50. Buchstaben sind nicht erlaubt.';else if(kind==='date'&&!toISODate(v))message='Bitte ein gültiges Datum im Format TT.MM.JJJJ eingeben.';else if(kind==='date'&&maxDate&&toISODate(v)>maxDate)message='Zu spät: Das Erinnerungsdatum liegt nach der Fälligkeit. Wähle ein Datum am oder vor dem Fälligkeitstag.';else if(kind==='date'&&toISODate(v)<todayISODate())message='Vergangene Erinnerungsdaten sind nicht erlaubt. Bitte heute oder ein zukünftiges Datum wählen.';else if(kind==='time'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v))message='Bitte eine gültige Uhrzeit auswählen.';err.textContent=message;inp.classList.toggle('invalid',!!message);inp.setAttribute('aria-invalid',message?'true':'false');save.disabled=!!message;save.setAttribute('aria-disabled',message?'true':'false');return !message}function finish(value){if(done)return;done=true;wrap.remove();resolve(value)}inp.addEventListener('input',()=>{if(kind==='date'){const before=inp.value;const formatted=normalizeTypedDate(before);if(formatted!==before){inp.value=formatted;try{inp.setSelectionRange(formatted.length,formatted.length)}catch(e){}}}validate()});wrap.querySelector('.cancel').addEventListener('click',()=>finish(null));save.addEventListener('click',()=>{if(validate())finish(inp.value.trim())});wrap.addEventListener('click',e=>{if(e.target===wrap)finish(null)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(validate())finish(inp.value.trim())}if(e.key==='Escape')finish(null)});validate();inp.focus();inp.select()})}

async function editNote(i){const old=i>=0?state.notes[i]:{title:'',body:'',reminder:{enabled:false,date:'',time:'09:00'}};const title=await appPrompt('Titel der Notiz:',old.title||'');if(title===null)return;if(!title.trim()){showToast('Bitte einen Titel eingeben');return}const body=await appPrompt('Notiztext:',old.body||'');if(body===null)return;const was=old.reminder||{enabled:false,date:'',time:'09:00'};const enabled=await appConfirm('Für diese Notiz eine eigene Erinnerung aktivieren?\n\nOK = aktivieren, Abbrechen = keine Erinnerung');let reminder={enabled:false,date:'',time:was.time||'09:00'};if(enabled){const date=await askValidated('Erinnerungsdatum (TT.MM.JJJJ)',was.date?formatReminderDate(was.date):todayGermanDate(),'date');if(date===null)return;const iso=toISODate(date);const time=await askValidated('Uhrzeit (24-Stunden-Format)',was.time||'09:00','time');if(time===null)return;reminder={enabled:true,date:iso,time};requestNotificationPermission()}const n={...old,id:old.id||('note-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),title:title.trim(),body:body.trim(),reminder};if(i>=0)state.notes[i]=n;else state.notes.unshift(n);persistState();render();showToast('Notiz und Erinnerung gespeichert')}
function todayGermanDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`}
function todayISODate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toISODate(v){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v);if(!m)return '';const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));return d.getFullYear()===Number(m[3])&&d.getMonth()===Number(m[2])-1&&d.getDate()===Number(m[1])?`${m[3]}-${m[2]}-${m[1]}`:''}
function isoLocalDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseLocalISO(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return d.getFullYear()===Number(m[1])&&d.getMonth()===Number(m[2])-1&&d.getDate()===Number(m[3])?d:null}
function addCadenceDate(start,cadence,steps=1){const interval=cadence==='Vierteljährlich'?3:cadence==='Jährlich'?12:1;const targetMonth=start.getMonth()+interval*steps;const year=start.getFullYear()+Math.floor(targetMonth/12);const month=((targetMonth%12)+12)%12;const day=Math.min(start.getDate(),new Date(year,month+1,0).getDate());return new Date(year,month,day)}
function nextInstallmentDue(startText,cadence,now=new Date(),endText=''){const iso=/^\d{4}-\d{2}-\d{2}$/.test(String(startText||''))?String(startText):toISODate(String(startText||''));const start=parseLocalISO(iso);if(!start)return null;const endISO=/^\d{4}-\d{2}-\d{2}$/.test(String(endText||''))?String(endText):toISODate(String(endText||''));const end=endISO?parseLocalISO(endISO):null;const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());let due;if(start>=today)due=start;else{let interval=cadence==='Vierteljährlich'?3:cadence==='Jährlich'?12:1;let months=(today.getFullYear()-start.getFullYear())*12+(today.getMonth()-start.getMonth());let steps=Math.max(0,Math.floor(months/interval)-1);due=addCadenceDate(start,cadence,steps);while(due<today){steps++;due=addCadenceDate(start,cadence,steps)}}if(end&&due>end)return null;return due}
function daysUntilDue(due,now=new Date()){if(!due)return null;const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const target=new Date(due.getFullYear(),due.getMonth(),due.getDate());return Math.round((target-today)/86400000)}
function dueCountdownLabel(due){const days=daysUntilDue(due);if(days===null)return 'Fälligkeit fehlt';if(days<0)return `Seit ${Math.abs(days)} Tagen überfällig`;if(days===0)return 'Heute fällig';if(days===1)return 'Noch 1 Tag';return `Noch ${days} Tage`}
function formatLocalDate(d){return d?`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`:'—'}
function formatReminderDate(iso){if(!iso)return 'Datum fehlt';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);return m?`${m[3]}.${m[2]}.${m[1]}`:iso}
function renderReminderSettings(){const items=[['inst','Raten & Verpflichtungen'],['one','Einmalige Ausgaben'],['goals','Sparziele']];return `<p style="font-size:11px;color:#aabbd0;line-height:1.6">Stelle für jeden Bereich unabhängig ein, ob du erinnert werden möchtest. Tag und Uhrzeit kannst du jederzeit ändern. Die Einstellungen werden auf diesem Gerät gespeichert.</p>${items.map(([key,name])=>{const r=state.reminders[key]||{enabled:false,day:1,time:'09:00'};return `<div class="reminder-row"><div class="reminder-top"><div><div class="reminder-name">${name}</div><div class="reminder-hint">Monatliche Erinnerung</div></div><label style="display:flex;align-items:center;gap:7px;font-size:11px"><input class="switch" type="checkbox" ${r.enabled?'checked':''} onchange="updateAreaReminder('${key}','enabled',this.checked)"> Aktiv</label></div><div class="reminder-grid"><label class="form-field"><span>Tag im Monat</span><select onchange="updateAreaReminder('${key}','day',this.value)">${Array.from({length:31},(_,j)=>j+1).map(d=>`<option value="${d}" ${Number(r.day)===d?'selected':''}>${d}. des Monats</option>`).join('')}</select></label><label class="form-field"><span>Uhrzeit</span><input type="time" value="${escapeHTML(r.time||'09:00')}" onchange="updateAreaReminder('${key}','time',this.value)"></label></div></div>`}).join('')}<div class="card"><div class="card-title">Einzelne Notizen</div><p style="font-size:11px;color:#aabbd0;line-height:1.6">Für jede Notiz stellst du eine eigene Erinnerung ein: Notizen öffnen, Stift antippen und Datum sowie Uhrzeit auswählen. Du kannst sie dort auch wieder abschalten.</p><button class="primary" onclick="navigate('notes')">Notizen verwalten</button></div><button class="primary" onclick="persistState();showToast('Erinnerungseinstellungen gespeichert')">Einstellungen speichern</button><p style="font-size:10px;color:#91a7c1;line-height:1.5">Hinweis: Diese HTML-Testversion kann Erinnerungen nur zuverlässig prüfen, solange die App im Browser geöffnet ist. Benachrichtigungen im Hintergrund oder bei geschlossener App sind auf iPhone nicht garantiert.</p>`}
function updateAreaReminder(key,field,value){state.reminders[key]=state.reminders[key]||{enabled:false,day:1,time:'09:00'};state.reminders[key][field]=field==='day'?Number(value):value;if(field==='enabled'&&value)requestNotificationPermission();persistState();if(field==='enabled')render();}
function requestNotificationPermission(){if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission().catch(()=>{});}}
function checkReminders(){const now=new Date(),date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;const notify=(key,title,body)=>{if(state.reminderFired[key]===date)return;state.reminderFired[key]=date;persistState();if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){showToast(title+': '+body)}}else{showToast(title+': '+body)}};for(const [key,name] of [['inst','Raten & Verpflichtungen'],['one','Einmalige Ausgaben'],['goals','Sparziele']]){const r=state.reminders?.[key];if(r?.enabled&&now.getDate()===Number(r.day)&&time===r.time)notify('area-'+key,name,'Deine monatliche Erinnerung ist fällig.')}for(const x of (state.inst||[])){const r=x[6];if(!r?.enabled||r.time!==time||!x[5])continue;const next=nextInstallmentDue(x[5],x[2],now,x[7]);const reminderDate=r.date|| (next?isoLocalDate(next):'');if(reminderDate===date)notify('inst-item-'+(x[0]||'rate'),x[0],'Deine Zahlungserinnerung ist heute fällig.')}for(const x of (state.one||[])){const r=x[5];if(r?.enabled&&r.date===date&&r.time===time)notify(x[6]||('one-'+x[0]),x[0],'Deine Erinnerung für diese einmalige Ausgabe ist fällig.')}for(const n of (state.notes||[])){const r=n.reminder;if(r?.enabled&&r.date===date&&r.time===time)notify('note-'+(n.id||n.title),n.title,n.body||'Deine Notiz-Erinnerung ist fällig.')}}
