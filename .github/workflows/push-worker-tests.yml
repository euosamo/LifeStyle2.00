name: Push worker tests

on:
  push:
    branches:
      - cleanup-hardening-2026-11-10
  pull_request:
    branches:
      - cleanup-hardening-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install push worker dependencies
        working-directory: push-worker
        run: npm install --no-audit --no-fund
      - name: Run push worker tests
        run: node --test tests/push-worker.test.mjs
