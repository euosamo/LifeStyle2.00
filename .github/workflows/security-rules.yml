name: Security rules tests

on:
  push:
    branches: [security-hardening-2026-11-04]
  pull_request:
    branches: [main]

concurrency:
  group: security-rules-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - name: Install test dependencies
        run: npm install --no-save --no-audit --no-fund firebase@latest @firebase/rules-unit-testing@latest firebase-tools@latest
      - name: Syntax-check runtime modules
        run: |
          node --check --input-type=module < firebase-login.js
          node --check --input-type=module < push-worker/src/index.js
      - name: Test Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-lifestyle-rules "node --test tests/*.test.mjs"
