name: Security rules tests

on:
  push:
    branches: [main-based-security-rebuild-2026-11-10]
  pull_request:
    branches: [main-based-security-rebuild-2026-11-10]

concurrency:
  group: security-rules-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true
      - name: Install test dependencies
        run: |
          npm install --no-save --no-audit --no-fund firebase@10.12.2 @firebase/rules-unit-testing@3.0.4 firebase-tools@15.35.0
          npm ci --prefix firebase-functions
      - name: Syntax-check runtime modules
        run: |
          node --check --input-type=module < firebase-login.js
          node --check --input-type=module < push-worker/src/index.js
          node --check firebase-functions/index.js
      - name: Test Firestore rules in emulator
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60000
        run: npx firebase emulators:exec --only firestore --project demo-lifestyle-rules "node --test tests/firestore.rules.test.mjs"
