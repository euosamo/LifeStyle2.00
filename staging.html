<body>
<section id="authGate" aria-live="polite">
  <div class="auth-card">
    <img class="auth-logo" src="./apple-touch-icon.png.png" width="180" height="180" alt="Lifestyle LS-Logo"><div class="auth-brand">Lifestyle Finanzen</div>
    <h1 id="authTitle">Willkommen zurück</h1>
    <p id="authSubtitle">Melde dich an, um deine Finanzen zu öffnen.</p>
    <form id="authForm">
      <label for="authEmail">E-Mail-Adresse</label><input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPassword">Passwort</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required><small id="authPasswordHint" class="auth-message" aria-live="polite"></small>
      <button id="authSubmit" type="submit">Anmelden</button>
    </form>
    <button id="authForgot" class="secondary" type="button">Passwort vergessen?</button>
    <button id="authSwitch" class="secondary" type="button">Neues Konto erstellen</button>
    <p id="authMessage" class="auth-message"></p>
    <p>Deine Finanzdaten werden nach Einrichtung des Online-Speichers getrennt pro Konto gespeichert.</p>
  </div>
</section>
<button id="authLogout" type="button" hidden>Abmelden</button>

<div class="app" id="app" hidden>
  <div id="topline" class="topline"></div>
  <main id="content" class="content"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>Startseite</span></button>
    <button class="nav-btn" data-page="bookings"><span class="nav-icon">▤</span><span>Buchungen</span></button>
    <button class="nav-btn" data-page="analytics"><span class="nav-icon">▥</span><span>Auswertung</span></button>
    <button class="nav-btn" data-page="more"><span class="nav-icon">⋮</span><span>Mehr</span></button>
  </nav>
</div>
